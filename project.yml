name: Orbit
options:
  bundleIdPrefix: online.foundry7
  deploymentTarget:
    iOS: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 11.0.0
targets:
  OrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OrbitUITests
    dependencies:
      - target: Orbit
  Orbit:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - OrbitUITests
    sources:
      - Orbit
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        UILaunchScreen:
