name: Orbit
options:
  bundleIdPrefix: online.foundry7
  deploymentTarget:
    iOS: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 11.0.0
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - Orbit
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # Google's public test app ID — replace with your real AdMob app ID for release.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.foundry7.orbit
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8R2N7396XY
        OTHER_LDFLAGS: -ObjC
